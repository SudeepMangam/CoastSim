services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - DEM_PATH=${DEM_PATH:-}
      - OCEAN_NETCDF_PATH=${OCEAN_NETCDF_PATH:-}
    volumes:
      - ./data:/app/data:ro
    ports:
      - "127.0.0.1:8000:8000"
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:80"
